# ===================================================================
# clients.conf — clientes RADIUS autorizados en dc1 (FreeRADIUS)
#
# server/deploy.sh copia este archivo a /etc/freeradius/3.0/clients.conf
# inyectando @RADIUS_SECRET@ desde RADIUS_SECRET de .env.
# Validación: sudo freeradius -XC
# ===================================================================

# ── Pruebas locales (radclient / radtest desde el propio dc1) ──
client localhost {
	ipaddr = 127.0.0.1
	proto = *
	secret = testing123
	nas_type = other
	require_message_authenticator = no
}

client localhost_ipv6 {
	ipv6addr = ::1
	secret = testing123
	require_message_authenticator = no
}

# ── Router TP-Link TL-WR850N (authenticator 802.1X del SSID) ──
# El mismo secreto debe estar en la UI del router:
#   Wireless → Security → WPA/WPA2-Enterprise
#   Radius Server IP      = 192.168.0.2
#   Radius Server Port    = 1812
#   Radius Server Password = RADIUS_SECRET (.env)
client tp-link-wr850n {
	ipaddr = 192.168.0.1
	secret = "@RADIUS_SECRET@"
	nas_type = other
	# El firmware 3.16.0 no garantiza Message-Authenticator en todos los
	# paquetes: se relaja la exigencia SOLO para este cliente.
	require_message_authenticator = no
}
