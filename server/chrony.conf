# ===================================================================
# chrony.conf — Servidor NTP de la red (el DC es la fuente de tiempo)
# ===================================================================
# El DC no arranca Kerberos si el reloj no está sincronizado. Chrony
# sirve la hora a la LAN: los clientes reciben por DHCP NTP = 192.168.0.10.
#
# Ajustar la fuente: si hay Internet, usar un pool público; si la LAN
# usa el router como paso, apuntar a él.

# Fuente de hora de referencia (ajustar según el entorno)
pool pool.ntp.org iburst

# Permitir que la LAN sincronice con este servidor
allow 192.168.0.0/24

# Si no hay Internet, perder precisión lentamente en vez de desviarse
local stratum 8