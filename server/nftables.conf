# ===================================================================
# nftables — Firewall del servidor (red única 192.168.0.0/24)
# ===================================================================
# Aplicar en el servidor:
#   sudo bash server/deploy.sh
#
# Verificar:
#   sudo nft list ruleset
#
# Red:  única 192.168.0.0/24 (admins + usuarios + clientes).
# La separación de tráfico se compensa con firewall por host + auth AD.
#
# ATENCIÓN: NO usar "flush ruleset" en este archivo. Docker crea sus
# propias cadenas (DOCKER, DOCKER-USER, NAT) y un flush global las
# borra, rompiendo el mapeo de puertos de los contenedores.
# Este config solo define la tabla `inet filter`; deploy.sh borra
# únicamente ESA tabla antes de recargar.
# ===================================================================
table inet filter {

    # ── IPs de los administradores (SSH/Portainer/DB) ──
    # Completar con las IPs de los notebooks de admins.
    set admin_ips {
        type ipv4_addr
        flags interval
        elements = {
            192.168.0.50,
            192.168.0.51,
            192.168.0.52
        }
    }

    # ── INPUT ────────────────────────────────────────────
    chain input {
        type filter hook input priority filter; policy drop;

        # Conexiones ya establecidas
        ct state established,related accept

        # Loopback
        iif "lo" accept

        # ICMP (ping)
        ip protocol icmp accept

        # ─── DHCP (Kea, host network, entra por broadcast) ───
        udp dport 67 accept

        # ─── DNS — DC nativo ───
        tcp dport 53 accept
        udp dport 53 accept

        # ─── AD — Kerberos / LDAP / kpasswd / GC / RPC ───
        tcp dport { 88, 389, 636, 464, 3268, 3269, 135 } ip saddr 192.168.0.0/24 accept
        udp dport { 88, 389, 464 } ip saddr 192.168.0.0/24 accept
        # RPC dinámicos (necesarios para join completo de Windows)
        tcp dport 49152-65535 ip saddr 192.168.0.0/24 accept

        # ─── SMB / NetBIOS ───
        tcp dport { 139, 445 } ip saddr 192.168.0.0/24 accept
        udp dport { 137, 138 } ip saddr 192.168.0.0/24 accept

        # ─── NTP (chrony nativo) ───
        udp dport 123 ip saddr 192.168.0.0/24 accept

        # ─── HTTP/HTTPS — nginx (contenedor web) ───
        tcp dport { 80, 443 } ip saddr 192.168.0.0/24 accept

        # ─── Correo (contenedor mail) ───
        tcp dport { 25, 110, 143, 587, 993, 995 } ip saddr 192.168.0.0/24 accept

        # ─── Impresión CUPS (contenedor print) ───
        tcp dport 1631 ip saddr 192.168.0.0/24 accept

        # ─── SOLO ADMINISTRADORES ───
        tcp dport { 22, 9443, 5432 } ip saddr @admin_ips accept

        # Log + drop el resto (rate limit para no llenar logs)
        log prefix "[nft-drop] " limit rate 5/minute drop
    }

    # ── FORWARD: Docker necesita la chain abierta ─────────
    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    # ── OUTPUT: tráfico saliente abierto ──────────────────
    chain output {
        type filter hook output priority filter; policy accept;
    }
}