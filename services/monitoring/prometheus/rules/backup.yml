# ===================================================================
# backup.yml — Alertas del backup (server/backup.sh → textfile collector)
#
#   server/backup.sh escribe /var/lib/tso-backup/backup.prom:
#     tso_backup_state                  1 = OK, 0 = falló
#     tso_backup_last_run_timestamp_seconds  última corrida (OK o FAIL)
#     tso_backup_duration_seconds       duración de la última corrida
#     tso_backup_warnings               avisos de la última corrida
#
#   El node_exporter lee ese archivo con --collector.textfile.directory.
#   validar: promtool check rules services/monitoring/prometheus/rules/backup.yml
# ===================================================================
groups:
  - name: backup
    rules:
      - alert: BackupFallido
        expr: tso_backup_state == 0
        for: 1m
        labels:
          severidad: alta
        annotations:
          resumen: "El último backup de dc1 FALLÓ"
          detalle: "En dc1: sudo bash server/backup.sh status  y  tail /var/log/tso-backup.log"

      - alert: BackupDesactualizado
        expr: time() - tso_backup_last_run_timestamp_seconds > 93600
        for: 30m
        labels:
          severidad: alta
        annotations:
          resumen: "El backup de dc1 no corre hace {{ $value | humanizeDuration }} (>26h)"
          detalle: "El cron 02:30 no está corriendo o el disco no está montado: revisá /etc/cron.d/tso-backup"

      - alert: BackupNuncaEjecutado
        expr: absent(tso_backup_state)
        for: 6h
        labels:
          severidad: media
        annotations:
          resumen: "Nunca corrió server/backup.sh en dc1 (no hay métricas)"
          detalle: "Instalá el backup: sudo bash server/backup.sh install && sudo bash server/backup.sh run"

      - alert: BackupConAvisos
        expr: tso_backup_warnings > 0
        for: 5m
        labels:
          severidad: baja
        annotations:
          resumen: "El backup de dc1 terminó con {{ $value }} aviso(s)"
          detalle: "Ej.: falló el respaldo del dominio AD o el pg_dump. Ver: server/backup.sh status"
