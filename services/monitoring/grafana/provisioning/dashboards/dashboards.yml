# ===================================================================
# Dashboard providers de Grafana: los JSON versionados en el repo se
# cargan solos (carpeta montada desde services/monitoring/grafana/dashboards).
# ===================================================================
apiVersion: 1

providers:
  - name: tso
    orgId: 1
    folder: TSO
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
