# ===================================================================
# datasource Prometheus para Grafana (provisioned desde el repo)
#   uid fijo = "prometheus" → los dashboards lo referencian así.
# ===================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
