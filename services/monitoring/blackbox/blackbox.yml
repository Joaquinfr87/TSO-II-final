# ===================================================================
# blackbox.yml — Módulos de prueba del blackbox_exporter
#   validar:
#   docker run --rm --entrypoint blackbox_exporter \
#     -v $PWD:/x prom/blackbox-exporter:v0.28.0 --config.check --config.file=/x/blackbox.yml
# ===================================================================
modules:
  # Prueba TCP: ¿acepta conexión en el puerto?
  tcp_connect:
    prober: tcp
    timeout: 6s
    tcp:
      preferred_ip_protocol: ip4

  # Prueba HTTP: 2xx/3xx/401/403. Sin seguir redirecciones: un 301 ya
  # cuenta como respuesta (evita caer en un TLS/SNI de otro servicio).
  http_2xx:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 301, 302, 401, 403]
      follow_redirects: false
      fail_if_ssl: false
      fail_if_not_ssl: false
      tls_config:
        insecure_skip_verify: true

  # Prueba DNS: el DC debe responder A para sudoers.lan
  dns_resolver:
    prober: dns
    timeout: 6s
    dns:
      query_name: "sudoers.lan"
      query_type: "A"
      preferred_ip_protocol: ip4
      valid_rcodes: [NOERROR]
