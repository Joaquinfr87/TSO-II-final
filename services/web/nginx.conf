# ==============================================================================
# Nginx — Proxy inverso de la intranet (servicio web)
# Enruta por nombre los servicios publicados. Los que no existen todavía
# (webmail/monitoring/apps) quedan comentados: se activan en su fase.
#
# TLS: certificado wildcard *.sudoers.lan (CA interna). Los archivos llegan
# por el volumen ./services/web/tls (generados con services/web/tls-gen.sh).
# Todo HTTP (80) redirige a HTTPS (443).
# ==============================================================================

# Soporte de WebSocket (Portainer)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── TLS / seguridad global ────────────────────────────────────────
ssl_certificate     /etc/nginx/tls/server.crt;
ssl_certificate_key /etc/nginx/tls/server.key;
ssl_protocols              TLSv1.2 TLSv1.3;
ssl_ciphers                HIGH:!aNULL:!MD5;
ssl_session_cache          shared:SSL:10m;
ssl_session_timeout        10m;

# ── 1. Impresión (CUPS) ─────────────────────────────────────────────
server {
    listen 80;
    server_name print.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name print.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cups_upstream http://tso-print:631;
        proxy_pass $cups_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 2. Portainer (panel de gestión Docker) ──────────────────────────
server {
    listen 80;
    server_name portainer.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portainer.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $portainer_upstream http://tso-portainer:9000;
        proxy_pass $portainer_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

