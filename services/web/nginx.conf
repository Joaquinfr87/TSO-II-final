# ── 4. Monitoring / Apps — Fase 5/6 ─────────────────────────────────
# dashboard.sudoers.lan  -> Netdata/Grafana (services/monitoring)
# apps.sudoers.lan       -> apps internas (services/apps)

# ── 5. Sitio principal (portal de la intranet) ──────────────────────
server {
    listen 80;
    server_name sudoers.lan web.sudoers.lan www.sudoers.lan;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ── 6. Servidor por defecto (acceso por IP o dominios desconocidos) ─
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}