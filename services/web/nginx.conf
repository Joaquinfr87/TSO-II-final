# ── 4. Monitoring / Apps — Fase 5/6 ─────────────────────────────────
# dashboard.sudoers.lan  -> Netdata/Grafana (services/monitoring)
# apps.sudoers.lan       -> apps internas (services/apps)

# ── 5. Sitio principal (portal de la intranet) ──────────────────────
server {
    listen 80;
    server_name sudoers.lan web.sudoers.lan www.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sudoers.lan web.sudoers.lan www.sudoers.lan;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ── 5b. Subdominios de miembros ────────────────────────────────────
# joaquin.sudoers.lan  -> página estática del equipo (/equipo/joaquin.html)
# david.sudoers.lan    -> servicio web de la MÁQUINA de David (192.168.0.51:8080)
# nicolas.sudoers.lan  -> servicio web de la MÁQUINA de Nicolás (192.168.0.52:8080)
# Los tres resuelven al proxy (192.168.0.2). Guía: docs/publicar-servicios-admin.md.
server {
    listen 80;
    server_name joaquin.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name joaquin.sudoers.lan;

    root /usr/share/nginx/html;

    location = / { try_files /equipo/joaquin.html =404; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name david.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name david.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $david_upstream http://192.168.0.51:8080;
        proxy_pass $david_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name nicolas.sudoers.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nicolas.sudoers.lan;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nicolas_upstream http://192.168.0.52:8080;
        proxy_pass $nicolas_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# ── 6. Servidores por defecto (IP directa o dominios desconocidos) ─
# HTTP (80): se empuja a HTTPS.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS (443): rechaza el handshake para hosts no contemplados.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}