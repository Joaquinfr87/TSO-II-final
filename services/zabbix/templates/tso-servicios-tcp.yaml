zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: ba0d18c243094ed38b22b0d757f0af97
      name: 'Templates/TSO'
  templates:
    - uuid: 730035695a5b47aeb02abe6220827ace
      template: 'TSO - Servicios TCP sin agente'
      name: 'TSO - Servicios TCP sin agente'
      description: |
        Chequeo de puertos TCP de los contenedores publicados en dc1 usando
        "Simple checks" (type SIMPLE): lo ejecuta el Zabbix server, NO necesita
        agente en el host. Sirve para avisar de inmediato si un servicio deja
        de responder, aunque todavía no esté instalado zabbix-agent2.

        net.tcp.service[tcp,,<puerto>] usa la IP de la interfaz del host.
        Se necesitan 3 fallos seguidos (delay 30s) antes de alertar.
      groups:
        - name: 'Templates/TSO'
      items:
        - uuid: 58a73196896d4b589b6ba62f78dbdf6d
          name: 'Servicio: web nginx (80)'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,80]'
          delay: '30s'
          valuemap:
            name: 'TSO servicio TCP'
          tags:
            - tag: component
              value: services
          triggers:
            - uuid: 2f0ff86cf27d46b2a74fa0ee233e09e0
              expression: 'max(/TSO - Servicios TCP sin agente/net.tcp.service[tcp,,80],#3)=0'
              name: 'Servicio: web nginx (80) caído'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
                - tag: component
                  value: services
                - tag: notify
                  value: admins
        - uuid: 74a65d6c36b8419abb5878d9bf6fb40c
          name: 'Servicio: web nginx TLS (443)'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,443]'
          delay: '30s'
          valuemap:
            name: 'TSO servicio TCP'
          tags:
