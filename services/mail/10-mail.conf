# /etc/dovecot/conf.d/10-mail.conf — Configuración de mailbox en Dovecot

# Formato de almacenamiento: Maildir (un archivo por email)
mail_location = maildir:~/Maildir

# Grupo con privilegios para acceder a mailboxes
mail_privileged_group = mail

# Namespace inbox: bandeja de entrada y carpetas estándar
namespace inbox {
  inbox = yes

  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# Protocolo IMAP: Habilitar IDLE para notificaciones en tiempo real
protocol imap {
  mail_max_userip_connections = 20
}

# Protocolo POP3: marcar como leído al descargar
protocol pop3 {
  pop3_uidl_format = %08Xu%08Xv
}