# /etc/dovecot/conf.d/10-ssl.conf — SSL/TLS en Dovecot

# Habilitar SSL (yes = usar si el cliente quiere, required = forzar)
ssl = yes

# Certificados auto-firmados (generados por entrypoint.sh)
# TODO (Fase 5): certificados de la CA interna como los del proxy.
ssl_cert = </etc/ssl/certs/mail.pem
ssl_key = </etc/ssl/private/mail.key

# Protocolos TLS permitidos (TLSv1.2+ es lo seguro actualmente)
ssl_min_protocol = TLSv1.2

# Cifrados permitidos (una lista segura y amplia)
ssl_cipher_list = ALL:!aNULL:!eNULL:!LOW:!EXP:!RC4:!MD5:!DES:!3DES