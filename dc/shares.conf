# ============================================================
# dc/shares.conf — Recursos de archivo del DC de Samba (AD)
#
# provision.sh lo copia a /etc/samba/shares.conf y agrega
#   include = /etc/samba/shares.conf
# al smb.conf generado por `samba-tool domain provision`.
# No reemplaces el smb.conf del DC a mano: ese lo genera Samba.
# ============================================================

[departamentos]
    comment = Compartido por departamento (permisos por grupos AD)
    path = /srv/samba/departamentos
    read only = no
    browseable = yes
    valid users = @SUDOERS\srv-files @SUDOERS\sistemas @SUDOERS\admins
    create mask = 0660
    directory mask = 0770
    force create mode = 0660
    force directory mode = 0770
    map acl inherit = yes
    veto files = /desktop.ini/lost+found/

[homes]
    comment = Directorio personal de cada usuario AD
    path = /srv/samba/homes/%U
    read only = no
    browseable = no
    valid users = %S
    create mask = 0700
    directory mask = 0700

[respaldo]
    comment = Zona de respaldo / intercambio con el sistema de backups
    path = /srv/samba/respaldo
    read only = no
    browseable = yes
    valid users = @SUDOERS\srv-files @SUDOERS\sistemas @SUDOERS\admins
    create mask = 0660
    directory mask = 0770
    force create mode = 0660
    force directory mode = 0770